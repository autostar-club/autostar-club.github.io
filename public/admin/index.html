<!-- public/admin/index.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Administration — Club Autostar</title>

    

  </head>
  <body>
    <!-- Script principal de Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <!-- Dans public/admin/index.html -->
<script>
  CMS.registerEditorComponent({
    id: "image-text-block",
    label: "Bloc Image + Texte côte à côte",
    fields: [
      { name: "image", label: "Image", widget: "image" },
      { name: "text", label: "Texte / Description", widget: "markdown" },
      { name: "imagePosition", label: "Position de l'image", widget: "select", options: ["Gauche", "Droite"], default: "Gauche" }
    ],
    pattern: /^<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center my-6 p-4 bg-slate-50 rounded-xl border border-slate-200">[\s\S]*?<\/div>/,
    fromBlock: function(match) {
      return {};
    },
    toBlock: function(obj) {
      return `
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center my-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
  <img src="${obj.image}" class="rounded-lg shadow-sm w-full object-cover" />
  <div>

${obj.text}

  </div>
</div>`;
    },
    toPreview: function(obj) {
      return `<div style="display:flex; gap:20px; align-items:center; background:#f8fafc; padding:15px;"><img src="${obj.image}" style="max-width:200px;"/><div>${obj.text}</div></div>`;
    }
  });

    CMS.registerPreviewStyle('https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css');

      // Widget personnalisé pour prévisualiser les images correctement
      const ImagePreview = createClass({
        render: function() {
          const value = this.props.value;
          if (!value) return null;
          // Résolution du chemin pour l'aperçu CMS
          const src = value.startsWith('/') ? value : '/' + value;
          return h('img', { src: src, style: { maxWidth: '100%', height: 'auto', borderRadius: '8px' } });
        }
      });

      CMS.registerWidget('custom-image', 'image', ImagePreview);
</script>
  </body>
</html>
