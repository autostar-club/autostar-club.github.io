<!-- public/admin/index.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Administration — Club Autostar</title>

    

  </head>
  <body>
    <!-- Script principal de Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <!-- Dans public/admin/index.html -->
<script>
      CMS.registerEditorComponent({
    id: "image-text-block",
    label: "Bloc Image + Texte",
    fields: [
      { name: "image", label: "Image", widget: "image" },
      { name: "text", label: "Texte / Description", widget: "markdown" }
    ],

    // Balise personnalisée <grid-block> que Decap CMS ne transformera jamais en HTML brut
    pattern: /^<grid-block image="([\s\S]*?)">([\s\S]*?)<\/grid-block>$/,

    fromBlock: function(match) {
      return {
        image: match[1] ? match[1].trim() : "",
        text: match[2] ? match[2].trim() : ""
      };
    },

    toBlock: function(obj) {
      const img = obj.image || "";
      const txt = obj.text || "";
      return `<grid-block image="${img}">\n${txt}\n</grid-block>`;
    },

    toPreview: function(obj, getAsset) {
      const imagePath = obj.image || "";
      const asset = imagePath ? getAsset(imagePath) : null;
      const imageSrc = asset ? asset.toString() : "";
      const text = obj.text || "*Aucun texte saisi*";

      return `
        <div style="display: flex; gap: 20px; align-items: center; background: #f8fafc; border: 1px solid #cbd5e1; padding: 16px; border-radius: 8px; margin: 16px 0;">
          <div style="flex: 1; max-width: 220px;">
            ${imageSrc 
              ? `<img src="${imageSrc}" style="width: 100%; border-radius: 6px; display: block; object-fit: cover;" />` 
              : `<div style="background: #e2e8f0; height: 100px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #64748b; font-size: 12px;">Pas d'image</div>`
            }
          </div>
          <div style="flex: 2; font-family: system-ui, sans-serif; font-size: 14px; color: #1e293b; line-height: 1.5;">
            ${text}
          </div>
        </div>
      `;
    }
  });
  
  
        CMS.registerPreviewStyle('https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.5.20/src/index.min.js');
      CMS.registerPreviewStyle('https://cdn.jsdelivr.net/npm/tailwindcss@4.3.3/index.min.css');


      // Widget personnalisé pour prévisualiser les images correctement
      const ImagePreview = createClass({
        render: function() {
          const value = this.props.value;
          if (!value) return null;
          // Résolution du chemin pour l'aperçu CMS
          const src = value.startsWith('/') ? value : '/' + value;
          return h('img', { src: src, style: { maxWidth: '100%', height: 'auto', borderRadius: '8px' } });
        }
      });

      CMS.registerWidget('custom-image', 'image', ImagePreview);

         // 2. INJECTER LES RÈGLES EXACTES DE VOTRE COMPOSANT Prose.astro
      CMS.registerPreviewStyle(`
        /* Reproduction exacte du rendu Prose.astro */
        .prose-preview-container {
          max-width: 100% !important;
          font-family: system-ui, -apple-system, sans-serif;
          color: #334155;
        }
        
        /* Justification du texte comme dans prose-p:text-justify */
        .prose-preview-container p {
          text-align: justify !important;
        }

        /* 🔴 FORCE L'AFFICHAGE DES PUCES (UL / OL) */
        .prose-preview-container ul {
          list-style-type: disc !important;
          padding-left: 1.5rem !important;
          margin-top: 1em !important;
          margin-bottom: 1em !important;
        }
        .prose-preview-container ol {
          list-style-type: decimal !important;
          padding-left: 1.5rem !important;
          margin-top: 1em !important;
          margin-bottom: 1em !important;
        }
        .prose-preview-container li {
          margin-top: 0.375em !important;
          margin-bottom: 0.375em !important;
        }

        /* Titres identiques à Prose.astro */
        .prose-preview-container h1 {
          font-size: 1.875rem !important;
          font-weight: 800 !important;
          color: #0f172a !important;
          border-bottom: 2px solid #b91c1c !important; /* Rouge Autostar */
          padding-bottom: 0.5rem !important;
          margin-top: 1.5rem !important;
          margin-bottom: 1rem !important;
        }
        .prose-preview-container h2 {
          font-size: 1.5rem !important;
          font-weight: 700 !important;
          color: #1e293b !important;
          margin-top: 2rem !important;
          margin-bottom: 0.75rem !important;
        }
        .prose-preview-container h3 {
          font-size: 1.25rem !important;
          font-weight: 600 !important;
          color: #b91c1c !important; /* Rouge Autostar */
          margin-top: 1.5rem !important;
          margin-bottom: 0.5rem !important;
        }

        /* Liens */
        .prose-preview-container a {
          color: #b91c1c !important;
          font-weight: 600 !important;
          text-decoration: none;
        }
        .prose-preview-container a:hover {
          text-decoration: underline !important;
        }

        /* Images centrées et arrondies */
        .prose-preview-container img {
          border-radius: 0.75rem !important;
          box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1) !important;
          margin-left: auto !important;
          margin-right: auto !important;
          max-width: 100% !important;
          height: auto !important;
        }
      `, { raw: true });

      // 3. TEMPLATE D'APERÇU UTILISANT LA CLASSE 'prose-preview-container'
      const ProsePreview = createClass({
        render: function() {
          const entry = this.props.entry;
          const title = entry.getIn(['data', 'title']) || '';
          const body = this.props.widgetFor('body');

          return h('div', { className: 'p-6 max-w-4xl mx-auto bg-white' },
            title && h('h1', { className: 'text-3xl font-extrabold text-slate-900 mb-6 border-b-2 border-red-700 pb-2' }, title),
            h('div', { className: 'prose prose-slate max-w-none prose-preview-container' }, body)
          );
        }
      });

      // Appliquer l'aperçu aux collections
      CMS.registerPreviewTemplate('sorties', ProsePreview);
      CMS.registerPreviewTemplate('fiches', ProsePreview);
      CMS.registerPreviewTemplate('pages', ProsePreview);

</script>
  </body>
</html>
